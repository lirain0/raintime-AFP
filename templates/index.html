<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFP-Predictor V4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 { font-size: 3rem; margin-bottom: 10px; }
        .header p { font-size: 1.2rem; opacity: 0.9; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { opacity: 0.9; }
        .result { margin-top: 20px; }
        .result-item {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .afp { background: #d4edda; color: #155724; }
        .non-afp { background: #f8d7da; color: #721c24; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-number { font-size: 2rem; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AFP-Predictor V4</h1>
            <p>Antifungal Peptide Prediction Platform</p>
        </div>

        <div class="card">
            <h2>Single Sequence Prediction</h2>
            <div class="input-group">
                <input type="text" id="sequence" placeholder="Enter amino acid sequence (e.g., GIGKFLHSAKKFGKAFVGEIMNS)">
                <button onclick="predict()">Predict</button>
            </div>
            <div id="result" class="result"></div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number">95.52%</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">600+</div>
                <div class="stat-label">Dimensions</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">&lt;1s</div>
                <div class="stat-label">Response Time</div>
            </div>
        </div>
    </div>

    <script>
        async function predict() {
            const sequence = document.getElementById('sequence').value;
            if (!sequence) {
                alert('Please enter a sequence');
                return;
            }

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sequence })
                });
                const data = await response.json();

                const resultDiv = document.getElementById('result');
                if (data.is_afp) {
                    resultDiv.innerHTML = `
                        <div class="result-item afp">
                            <h3>AFP Detected</h3>
                            <p>Probability: ${data.afp_probability}%</p>
                            <p>Confidence: ${data.confidence_level}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result-item non-afp">
                            <h3>Non-AFP</h3>
                            <p>Probability: ${data.afp_probability}%</p>
                            <p>Confidence: ${data.confidence_level}</p>
                        </div>
                    `;
                }
            } catch (error) {
                alert('Prediction failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
